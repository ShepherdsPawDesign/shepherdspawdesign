<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Shepherd's Paw Design</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=4">
</head>
<body>

  <!-- ヘッダー: サイト名や名前 -->
  <header class="site-header">
    <a href="index.html" class="logo">Shepherd's Paw Design</a>
    <input type="checkbox" id="nav-toggle" class="nav-toggle">
    <label for="nav-toggle" class="nav-toggle-label" aria-label="メニューを開く">
      <span></span>
      <span></span>
      <span></span>
    </label>
    <nav class="site-nav" aria-label="メインメニュー">
      <a href="works.html">Works</a>
      <a href="about.html">About me</a>
      <a href="shop.html">Shop</a>
      <a href="contact.html">Contact</a>
    </nav>
    <div class="language-switch" aria-label="言語選択">
      <a href="contact.html" aria-current="page">日本語</a><span>/</span><a href="en/contact.html">English</a>
    </div>
  </header>

  <!-- お問い合わせフォーム -->
  <section class="contact">
    <h2>Contact</h2>
    <p class="contact-lead">
      ご依頼・ご相談などがありましたら、以下のフォームからお気軽にお問い合わせください。
    </p>

    <form class="contact-form" action="https://api.web3forms.com/submit" method="POST">
      <input type="hidden" name="access_key" value="a5943a26-a567-4814-bb70-3522ca2fee59">
      <input type="hidden" name="subject" value="Shepherd's Paw Design サイトからのお問い合わせ">
      <input type="hidden" name="from_name" value="Shepherd's Paw Design">

      <div class="form-field">
        <label for="name">お名前<span class="required">*</span></label>
        <input type="text" id="name" name="name" required autocomplete="name">
      </div>

      <div class="form-field">
        <label for="email">メールアドレス<span class="required">*</span></label>
        <input type="email" id="email" name="email" required autocomplete="email">
      </div>

      <div class="form-field">
        <label for="message">お問い合わせ内容<span class="required">*</span></label>
        <textarea id="message" name="message" rows="7" required></textarea>
      </div>

      <!-- hCaptcha: Web3Forms のサイトキーで自動的に描画される -->
      <div class="h-captcha" data-captcha="true"></div>

      <button type="submit" class="submit-button">送信する</button>
    </form>

    <p class="contact-note">
      ※ 送信後は Web3Forms の完了ページが表示されます。<br>
      ※ 返信は入力いただいたメールアドレス宛にお送りします。
    </p>
  </section>

  <!-- フッター: SNSリンクなど -->
  <footer class="site-footer">
    <div class="footer-links">
      <a href="#">Bluesky</a>
      <a href="#">Instagram</a>
      <a href="contact.html">Contact</a>
    </div>
    <p class="copyright">&copy; 2026 Shepherd's Paw Design</p>
  </footer>

  <script src="language.js"></script>
  <script src="https://web3forms.com/client/script.js" async defer></script>
</body>
</html>
