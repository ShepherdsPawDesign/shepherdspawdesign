<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Your Name</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ヘッダー: サイト名や名前 -->
  <header class="site-header">
    <a href="index.html" class="logo">Your Name</a>
  </header>

  <!-- お問い合わせフォーム -->
  <section class="contact">
    <h2>Contact</h2>
    <p class="contact-lead">
      ご依頼・ご相談などがありましたら、以下のフォームからお気軽にお問い合わせください。
    </p>

    <p class="contact-form">
      <a class="submit-button" href="https://docs.google.com/forms/d/e/YOUR_FORM_ID/viewform" target="_blank" rel="noopener noreferrer">
        Google フォームでお問い合わせする
      </a>
    </p>

    <p class="contact-note">
      ※ Google フォームの URL に差し替えてください。リンクをクリックすると、新しいタブでフォームが開きます。
    </p>
  </section>

  <!-- フッター: SNSリンクなど -->
  <footer class="site-footer">
    <div class="footer-links">
      <a href="#">Bluesky</a>
      <a href="#">Instagram</a>
      <a href="contact.html">Contact</a>
    </div>
    <p class="copyright">&copy; 2026 Your Name</p>
  </footer>

</body>
</html>
