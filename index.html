<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Name | Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ヘッダー: サイト名や名前 -->
  <header class="site-header">
    <p class="logo">Your Name</p>
  </header>

  <!-- 一言自己紹介エリア -->
  <section class="intro">
    <h1>Your Name</h1>
    <p class="intro-sub">Designer / Illustrator</p>
    <p class="intro-text">
      ここに一言キャッチコピーを入れます。<br>
      例:「絵と設計で、伝わるものをつくる。」
    </p>
  </section>

  <!-- Works: 作品一覧 -->
  <section class="works" id="works">
    <h2>Works</h2>

    <div class="works-grid">

      <!-- 作品カード1 -->
      <a class="work-card" href="#">
        <div class="work-thumb"></div>
        <p class="work-title">作品タイトル 1</p>
        <p class="work-tag">Illustration</p>
      </a>

      <!-- 作品カード2 -->
      <a class="work-card" href="#">
        <div class="work-thumb"></div>
        <p class="work-title">作品タイトル 2</p>
        <p class="work-tag">UI Design</p>
      </a>

      <!-- 作品カード3 -->
      <a class="work-card" href="#">
        <div class="work-thumb"></div>
        <p class="work-title">作品タイトル 3</p>
        <p class="work-tag">Illustration</p>
      </a>

      <!-- 作品カード4 -->
      <a class="work-card" href="#">
        <div class="work-thumb"></div>
        <p class="work-title">作品タイトル 4</p>
        <p class="work-tag">Branding</p>
      </a>

      <!-- カードを増やしたい場合は、この <a class="work-card">〜</a> のブロックを
           そのままコピー＆ペーストして、中身だけ書き換えればOKです -->

    </div>
  </section>

  <!-- フッター: SNSリンクなど -->
  <footer class="site-footer">
    <div class="footer-links">
      <a href="#">X (Twitter)</a>
      <a href="#">Instagram</a>
      <a href="mailto:you@example.com">Email</a>
    </div>
    <p class="copyright">&copy; 2026 Your Name</p>
  </footer>

</body>
</html>
