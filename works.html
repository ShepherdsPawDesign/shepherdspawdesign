  <main class="works-page">
    <div class="works-page-heading">
      <p class="eyebrow">Works</p>
      <h1>Selected works</h1>
      <p>作品をクリックすると、詳細をご覧いただけます。</p>
    </div>

    <div class="gallery-grid">
      <button id="chrono-logo" class="gallery-card gallery-card-1" type="button" data-image="images/work1.png" data-title="Chrono Logo" data-category="Logo Design" data-tools="使用ツール：Illustrator" data-description="Chrono Technologiesのために制作したロゴデザインです。サンフランシスコを拠点に、生産性向上ツール開発を行っている会社です。" data-preview="https://www.chronohq.com/" data-preview-label="Chronoの公式サイト →">
        <div class="gallery-image-frame"><img src="images/work1.png" alt="Chrono Logo"></div>
        <span class="gallery-title">Chrono Logo</span><span class="gallery-tag">Logo Design</span>
      </button>
      <button id="big-cute-wolves" class="gallery-card gallery-card-padded" type="button" data-image="images/work2.png" data-title="Big Cute Wolves" data-category="Illustration" data-tools="使用ツール：Illustrator" data-description="オオカミをモチーフにしたイラストレーションです。">
        <div class="gallery-image-frame"><img src="images/work2.png" alt="Big Cute Wolves"></div>
        <span class="gallery-title">Big Cute Wolves</span><span class="gallery-tag">Illustration</span>
      </button>
      <button id="nordic-dreams-logo" class="gallery-card gallery-card-padded" type="button" data-image="images/work3.png" data-title="Nordic Dreams Logo" data-category="Logo Design" data-tools="使用ツール：Illustrator" data-description="米国ユタ州でホワイトスイスシェパードを専門にブリーディングするNordic Dreams White Swiss Shepherdsのために制作したロゴデザインです。ユタ州の美しい自然のなかで、犬種スタンダードに沿った、健康で安定した気質の犬を育てるポリシーを表現しています。" data-preview="https://www.nordicdreamswhiteshepherds.com/" data-preview-label="Nordic Dreamsの公式サイト →">
        <div class="gallery-image-frame"><img src="images/work3.png" alt="Nordic Dreams Logo"></div>
        <span class="gallery-title">Nordic Dreams Logo</span><span class="gallery-tag">Logo Design</span>
      </button>
      <button id="summer-english-lesson" class="gallery-card" type="button" data-image="images/work4.png" data-title="Moetさんの夏休み英語レッスン案内" data-category="Flyer Design" data-tools="使用ツール：Illustrator" data-description="Moetさんからご依頼いただいた、夏休み英語レッスンの受講者募集案内。無料カウンセリングやオンライン・対面レッスンの内容を、夏らしいビジュアルで伝えるチラシにまとめました。">
        <img src="images/work4.png" alt="Moetさんの夏休み英語レッスン案内">
        <span class="gallery-title">Moetさんの夏休み英語レッスン案内</span><span class="gallery-tag">Flyer Design</span>
      </button>
      <button id="uki-uki-saluki" class="gallery-card gallery-card-padded" type="button" data-image="images/work5.png" data-title="Uki Uki Saluki" data-category="Illustration" data-tools="使用ツール：Illustrator" data-description="サルーキをモチーフにしたイラストレーションです。">
        <div class="gallery-image-frame"><img src="images/work5.png" alt="Uki Uki Saluki"></div>
        <span class="gallery-title">Uki Uki Saluki</span><span class="gallery-tag">Illustration</span>
      </button>
      <button id="simple-wss" class="gallery-card gallery-card-padded" type="button" data-image="images/work6.png" data-title="Simple WSS" data-category="Illustration" data-tools="使用ツール：Illustrator" data-description="シンプルな形と線で構成したイラストレーションです。">
        <div class="gallery-image-frame"><img src="images/work6.png" alt="Simple WSS"></div>
        <span class="gallery-title">Simple WSS</span><span class="gallery-tag">Illustration</span>
      </button>
      <button id="pizza-tori-menu" class="gallery-card gallery-card-padded" type="button" data-image="images/work7.png" data-image-secondary="images/work7b.png" data-title="PizzaTori Menu Design" data-category="Menu Design" data-tools="使用ツール：Illustrator, InDesign" data-description="自主制作。実在するレストランPizzaToriのメニューを再構成したデザイン提案です。表裏の2ページを一つのメニューとして、ピザを中心とした料理の情報を整理し、親しみやすく統一感のあるレイアウトにまとめました。">
        <div class="gallery-image-frame"><img src="images/work7.png" alt="PizzaTori menu design"></div>
        <span class="gallery-title">PizzaTori Menu Design</span><span class="gallery-tag">Menu Design</span>
      </button>
      <button id="wool-and-woof" class="gallery-card gallery-card-padded" type="button" data-image="images/A3Magazine.pdf.png" data-title="WOOL and WOOF Magazine" data-category="Editorial Design" data-tools="使用ツール：InDesign" data-description="カレッジの課題として制作した16ページの雑誌デザインです。『WOOL and WOOF』という架空の雑誌を企画し、Pacific Northwestの先住民コミュニティとウール・ドッグの歴史を扱う特集記事を、表紙から本文まで編集・レイアウトしました。長文記事、写真、引用、ページ番号、グリッドを組み合わせ、読み進めやすい誌面を設計しています。" data-case-study="documents/A3Magazine.pdf" data-case-study-label="雑誌PDFを見る →">
        <div class="gallery-image-frame"><img src="images/A3Magazine.pdf.png" alt="WOOL and WOOF magazine cover"></div>
        <span class="gallery-title">WOOL and WOOF Magazine</span><span class="gallery-tag">Editorial Design</span>
      </button>
      <button id="library" class="gallery-card gallery-card-library" type="button" data-image="images/library-website.png" data-title="ソルトスプリング島図書館ウェブサイト" data-category="UI/UX Case Study" data-tools="使用ツール：Figma, Illustrator" data-description="Independent, unsolicited case study。カレッジの課題として制作した、Salt Spring Island Public Libraryの既存ウェブサイトに対するUX分析と改善案です。情報の優先度を整理し、デスクトップとタブレットで使いやすい構成を提案しました。" data-preview="https://www.figma.com/proto/N9I0WxmJmhXmmOpoozDyMQ/Salt-Spring-Island-Library-Website-Plan?node-id=145-279&starting-point-node-id=145%3A279" data-case-study="documents/SSILibraryUXcaseStudyForWeb.pdf" data-case-study-label="ケーススタディPDFを見る →">
        <div class="gallery-image-frame"><img src="images/library-website.png" alt="Salt Spring Island Library website redesign"></div>
        <span class="gallery-title">ソルトスプリング島図書館ウェブサイト</span><span class="gallery-tag">UI/UX Case Study</span>
      </button>
       <button id="pet-store" class="gallery-card gallery-card-uiux" type="button" data-image="images/curious-paw-app.webp" data-title="Curious Paw（ペット用品店モバイルアプリ）" data-category="UI/UX Design" data-tools="使用ツール：Figma, Illustrator" data-description="Curious Pawという架空のペット用品店を想定したモバイルアプリのUI/UXデザイン。ログイン、商品カテゴリ、アカウント、カートまでの主要画面を設計しました。" data-preview="https://www.figma.com/proto/0cRw7XVqewDugNJkGr53F0/Curious-Paw?node-id=35-607&p=f&t=KagDzVi9bp5r65gY-0&scaling=scale-down&content-scaling=fixed&page-id=35%3A507&starting-point-node-id=35%3A607" data-presentation="documents/curiousPawPresentation.pdf">
        <div class="gallery-image-frame"><img src="images/curious-paw-app.webp" alt="Curious Paw pet supply store mobile app design"></div>
        <span class="gallery-title">Curious Paw（ペット用品店モバイルアプリ）</span><span class="gallery-tag">UI/UX Design</span>
      </button>
    </div>

    </div>
  </dialog>
